<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ログイン用リンク</title></head>
<body style="margin:0;padding:24px 12px;background:#f4f6fa;color:#0b1220;font-family:'Hiragino Sans','Hiragino Kaku Gothic ProN','Noto Sans JP',Meiryo,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:24px;">
    <tr><td style="padding:32px 28px;">
      <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 28px;">
        <tr>
          <td style="vertical-align:middle;"><img src="https://app.kenbei.jp/icon-192.png" width="40" height="40" alt="KENBEI" style="display:block;border:0;border-radius:10px;"></td>
          <td style="vertical-align:middle;padding-left:10px;font-size:20px;font-weight:700;letter-spacing:0.04em;">KENBEI</td>
        </tr>
      </table>
      <p style="margin:0 0 16px;font-size:20px;font-weight:700;line-height:1.5;">ログイン用リンク</p>
      <p style="margin:0 0 28px;font-size:15px;line-height:1.8;color:#334155;">下のボタンから、KENBEIにログインできます。</p>
      <p style="margin:0 0 28px;">
        <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#0a66ff;color:#ffffff;text-decoration:none;border-radius:14px;padding:14px 24px;font-size:16px;font-weight:700;">KENBEIにログインする</a>
      </p>
      <p style="margin:0 0 8px;font-size:13px;line-height:1.7;color:#64748b;">ボタンが押せない場合は、次のURLをブラウザに貼り付けてください。</p>
      <p style="margin:0 0 28px;font-size:12px;line-height:1.6;color:#64748b;word-break:break-all;">{{ .ConfirmationURL }}</p>
      <p style="margin:0 0 24px;font-size:13px;line-height:1.7;color:#64748b;">このメールに心当たりがない場合は、何もせずに削除してください。</p>
      <p style="margin:0;padding-top:20px;border-top:1px solid #e2e8f0;font-size:12px;line-height:1.7;color:#94a3b8;">KENBEI（施工管理・現場管理Webサービス）<br>お問い合わせ：support@kenbei.jp</p>
    </td></tr>
  </table>
</body>
</html>
